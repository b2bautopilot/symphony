name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-pr-description:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: {group: Public-local, labels: [self-hosted, Linux, X64]}
    defaults:
      run:
        shell: bash
        working-directory: elixir

    container: ubuntu:24.04
    steps:
      - name: Prepare Ubuntu container tools
        working-directory: ${{ github.workspace }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git git-lfs jq unzip xz-utils python3 python3-venv python3-pip build-essential pkg-config libssl-dev libncurses-dev file wget gnupg
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          printf '%s' "$PR_BODY_JSON" | jq -r '.' > /tmp/pr_body.md
          mix pr_body.check --file /tmp/pr_body.md
